<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chittly v2 — Smart Chit Fund Manager</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#E0F2F1;color:#333;font-size:14px;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#006064,#004D40)}
.login-box{background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:36px 28px;max-width:360px;width:100%;text-align:center}
.login-box h1{font-size:28px;color:#fff;margin-bottom:4px}
.login-box .tagline{color:rgba(255,255,255,0.6);font-size:12px;margin-bottom:20px}
.login-box input{width:100%;padding:12px 14px;border:2px solid rgba(255,255,255,0.15);border-radius:10px;font-size:14px;margin-bottom:10px;background:rgba(255,255,255,0.05);color:#fff}
.login-box input::placeholder{color:rgba(255,255,255,0.4)}
.login-box input:focus{outline:none;border-color:#FFD700}
.login-box .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#FFD700,#FFA000);color:#004D40;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.login-box .btn-link{background:none;border:none;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;margin-top:10px;text-decoration:underline}
.login-error{color:#FF5252;font-size:12px;margin-top:8px;display:none}
.app{display:none}
.header{background:linear-gradient(135deg,#006064,#004D40);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:17px}
.header-right{display:flex;align-items:center;gap:8px}
.role-badge{background:rgba(255,215,0,0.2);color:#FFD700;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600}
.logout-btn{background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:10px;cursor:pointer}
.container{max-width:650px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card h2{font-size:12px;color:#006064;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #E0F2F1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:12px;color:#555;font-weight:600;min-width:100px}
input[type="number"],input[type="text"],input[type="email"],input[type="date"],select{padding:9px 11px;border:2px solid #e0e0e0;border-radius:8px;font-size:13px;max-width:200px;width:100%}
input:focus,select:focus{outline:none;border-color:#006064}
.btn{padding:9px 14px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}
.btn-primary{background:#006064;color:#fff}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FFA000);color:#004D40}
.btn-green{background:#2E7D32;color:#fff}
.btn-red{background:#D32F2F;color:#fff}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{padding:6px 10px;font-size:11px}
.btn-full{width:100%;padding:12px;font-size:14px}
.tabs{display:flex;gap:3px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tab{padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:#555;white-space:nowrap}
.tab.active{border-color:#006064;background:#006064;color:#fff}
.tc{display:none}.tc.active{display:block}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #f0f0f0;font-size:12px}
.item:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600}
.b-won{background:#E8F5E9;color:#2E7D32}
.b-pending{background:#FFF3E0;color:#E65100}
.b-approved{background:#E3F2FD;color:#1565C0}
.b-waiting{background:#FCE4EC;color:#C62828}
.b-agent{background:#EDE7F6;color:#6A1B9A}
.b-paid{background:#E8F5E9;color:#2E7D32}
.b-unpaid{background:#FFEBEE;color:#D32F2F}
.b-review{background:#FFF3E0;color:#E65100}
.b-rejected{background:#FFCDD2;color:#B71C1C}
.stars{color:#FFD700;font-size:11px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sc{background:#f5f5f5;border-radius:8px;padding:10px;text-align:center}
.sc .v{font-size:18px;font-weight:700;color:#006064}
.sc .l{font-size:9px;color:#777;margin-top:2px}
.lottery-box{text-align:center;padding:20px;background:linear-gradient(135deg,#006064,#004D40);border-radius:12px;color:#fff;margin:12px 0}
.lottery-box h3{font-size:16px;margin-bottom:12px}
.lottery-spinner{font-size:28px;font-weight:700;color:#FFD700;min-height:40px;margin:12px 0}
.lottery-btn{background:#FFD700;color:#004D40;border:none;padding:14px 30px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
.lottery-btn:active{opacity:.7}
.lottery-btn:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:8px;border-radius:6px;margin:6px 0;font-size:11px}
.msg-ok{background:#E8F5E9;color:#2E7D32}
.msg-err{background:#FFEBEE;color:#D32F2F}
.tbl{width:100%;font-size:11px;border-collapse:collapse}
.tbl th{background:#006064;color:#fff;padding:6px;font-size:10px}
.tbl td{padding:5px;border:1px solid #eee;text-align:center}
.note{font-size:10px;color:#999;margin-top:4px;font-style:italic}
.due-date-box{background:linear-gradient(135deg,#FF6F00,#E65100);color:#fff;border-radius:10px;padding:12px 16px;margin:10px 0;display:flex;align-items:center;gap:10px}
.due-date-box .icon{font-size:24px}
.due-date-box .info{font-size:12px}
.due-date-box .info b{font-size:14px;display:block;margin-bottom:2px}
.payment-proof-box{border:2px dashed #e0e0e0;border-radius:10px;padding:16px;text-align:center;margin:10px 0;cursor:pointer;transition:border-color .2s}
.payment-proof-box:hover{border-color:#006064}
.payment-proof-box input[type="file"]{display:none}
.payment-proof-box .upload-icon{font-size:32px;margin-bottom:6px}
.payment-proof-box p{font-size:11px;color:#777}
.proof-img{max-width:200px;max-height:200px;border-radius:8px;margin:8px auto;display:block;border:2px solid #e0e0e0}
.payment-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0}
.payment-cell{background:#f9f9f9;border-radius:8px;padding:10px;text-align:center;font-size:11px;border:2px solid #e0e0e0}
.payment-cell.paid{border-color:#4CAF50;background:#E8F5E9}
.payment-cell.unpaid{border-color:#D32F2F;background:#FFEBEE}
.payment-cell.review{border-color:#FF9800;background:#FFF3E0}
.payment-cell.rejected{border-color:#B71C1C;background:#FFCDD2}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
<div class="login-box">
<h1>Chittly</h1>
<p class="tagline">Smart Chit Fund Manager v2</p>
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="btn-login" onclick="doLogin()">LOGIN</button>
<button class="btn-link" onclick="toggleReg()">New? Register here</button>
<div id="regFields" style="display:none;margin-top:12px">
<input type="text" id="regName" placeholder="Full Name">
<input type="email" id="regEmail" placeholder="Email">
<input type="text" id="regPhone" placeholder="Phone (91xxxxxxxxxx)">
<input type="password" id="regPass" placeholder="Password (min 6)">
<button class="btn-login" style="background:#4CAF50;color:#fff" onclick="doRegister()">REGISTER</button>
</div>
<p class="login-error" id="loginError"></p>
</div>
</div>

<!-- APP SHELL -->
<div id="app" class="app">
<div class="header">
<h1>Chittly</h1>
<div class="header-right">
<span id="userInfo" style="font-size:10px;opacity:.7"></span>
<span class="role-badge" id="roleBadge"></span>
<button class="logout-btn" onclick="doLogout()">Logout</button>
</div>
</div>
<div class="container" id="mainContainer">
<div style="text-align:center;padding:40px;color:#999">Loading...</div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════════════════
firebase.initializeApp({
    apiKey:"AIzaSyBGeuNGyr5N7xEKr-1XTeFcbeog2H8LZoQ",
    authDomain:"chittly.firebaseapp.com",
    projectId:"chittly",
    storageBucket:"chittly.firebasestorage.app",
    messagingSenderId:"160161440830",
    appId:"1:160161440830:web:3d255a5b0fbe19d6f01d6f"
});
const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();
let CU=null,UR='member',UD={};

// ═══════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════
function doLogin(){
    const e=document.getElementById('loginEmail').value.trim();
    const p=document.getElementById('loginPass').value;
    const err=document.getElementById('loginError');
    err.style.display='none';
    auth.signInWithEmailAndPassword(e,p).catch(x=>{err.textContent=x.message;err.style.display='block';});
}
function doRegister(){
    const name=document.getElementById('regName').value.trim();
    const email=document.getElementById('regEmail').value.trim();
    const phone=document.getElementById('regPhone').value.trim();
    const pass=document.getElementById('regPass').value;
    const err=document.getElementById('loginError');
    if(!name||!email){err.textContent='Name and email required.';err.style.display='block';return;}
    err.style.display='none';
    auth.createUserWithEmailAndPassword(email,pass).then(c=>{
        return db.collection('users').doc(c.user.uid).set({name,email,phone,role:'member',rating:5,onTime:0,late:0,agentId:null,createdAt:new Date()});
    }).catch(x=>{err.textContent=x.message;err.style.display='block';});
}
function doLogout(){auth.signOut();}
function toggleReg(){const el=document.getElementById('regFields');el.style.display=el.style.display==='none'?'block':'none';}

auth.onAuthStateChanged(async u=>{
    if(u){
        CU=u;
        const doc=await db.collection('users').doc(u.uid).get();
        if(doc.exists){UD=doc.data();UR=UD.role||'member';}
        else{UD={name:u.email,role:'member'};UR='member';}
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('app').style.display='block';
        document.getElementById('userInfo').textContent=UD.name;
        document.getElementById('roleBadge').textContent=UR.toUpperCase();
        renderDashboard();
    }else{
        CU=null;UR='member';UD={};
        document.getElementById('loginScreen').style.display='flex';
        document.getElementById('app').style.display='none';
    }
});

// ═══════════════════════════════════════════════════════════
// RENDER BASED ON ROLE
// ═══════════════════════════════════════════════════════════
function renderDashboard(){
    if(UR==='admin') renderAdmin();
    else if(UR==='agent') renderAgent();
    else renderMember();
}

// ═══════════════════════════════════════════════════════════
// ADMIN VIEW
// ═══════════════════════════════════════════════════════════
async function renderAdmin(){
    const mc=document.getElementById('mainContainer');
    mc.innerHTML=`<div class="tabs">
        <div class="tab active" onclick="aTab(this,'a-users')">Users</div>
        <div class="tab" onclick="aTab(this,'a-agents')">Agents</div>
        <div class="tab" onclick="aTab(this,'a-pools')">Pools</div>
        <div class="tab" onclick="aTab(this,'a-approve')">Approvals</div>
        <div class="tab" onclick="aTab(this,'a-payments')">Payments</div>
        <div class="tab" onclick="aTab(this,'a-create')">Create Pool</div>
        <div class="tab" onclick="aTab(this,'a-manage')">Manage Pool</div>
    </div>
    <div id="a-users" class="tc active"></div>
    <div id="a-agents" class="tc"></div>
    <div id="a-pools" class="tc"></div>
    <div id="a-approve" class="tc"></div>
    <div id="a-payments" class="tc"></div>
    <div id="a-create" class="tc"></div>
    <div id="a-manage" class="tc"></div>`;
    loadAdminUsers();
}
function aTab(el,id){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tc').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(id).classList.add('active');
    if(id==='a-users')loadAdminUsers();
    if(id==='a-agents')loadAdminAgents();
    if(id==='a-pools')loadAdminPools();
    if(id==='a-approve')loadAdminApprovals();
    if(id==='a-payments')loadPaymentDashboard();
    if(id==='a-create')loadAdminCreatePool();
    if(id==='a-manage')loadAdminManagePools();
}

async function loadAdminUsers(){
    const snap=await db.collection('users').get();
    // Also load pools for "Add to Pool" feature
    const poolSnap=await db.collection('pools').where('approved','==',true).get();
    let poolOpts='<option value="">-- Add to Pool --</option>';
    poolSnap.forEach(doc=>{const p=doc.data();const spots=p.numMembers-(p.members||[]).length;if(spots>0) poolOpts+=`<option value="${doc.id}">${p.name} (${spots} spots)</option>`;});

    let html='<div class="card"><h2>All Registered Users</h2>';
    snap.forEach(doc=>{
        const u=doc.data();
        const rb=u.role==='admin'?'<span class="badge b-approved">Admin</span>':u.role==='agent'?'<span class="badge b-agent">Agent</span>':'<span class="badge b-pending">Member</span>';
        const delBtn=u.role!=='admin'?`<button class="btn btn-red btn-sm" style="margin-top:4px" onclick="deleteUser('${doc.id}','${u.name}')">🗑 Delete</button>`:'';
        html+=`<div class="item"><div><b>${u.name}</b><br><span style="font-size:10px;color:#777">${u.email} | ${u.phone||'—'}</span></div><div>${rb}<br><select style="font-size:10px;padding:2px;margin-top:4px" onchange="changeRole('${doc.id}',this.value)"><option value="member" ${u.role==='member'?'selected':''}>Member</option><option value="agent" ${u.role==='agent'?'selected':''}>Agent</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select><br><select style="font-size:10px;padding:2px;margin-top:4px" onchange="adminAddToPool('${doc.id}',this.value);this.selectedIndex=0">${poolOpts}</select><br>${delBtn}</div></div>`;
    });
    html+='</div>';
    document.getElementById('a-users').innerHTML=html;
}

async function changeRole(uid,role){
    await db.collection('users').doc(uid).update({role});
    loadAdminUsers();
}

async function deleteUser(uid,name){
    if(!confirm('Delete user "'+name+'" from the system? This will remove them from all pools too.')) return;
    // Remove from all pools
    const poolSnap=await db.collection('pools').get();
    const batch=db.batch();
    const userDoc=await db.collection('users').doc(uid).get();
    const userEmail=userDoc.data().email;
    poolSnap.forEach(doc=>{
        const p=doc.data();
        const members=(p.members||[]).filter(m=>m.uid!==uid && m.email!==userEmail);
        const joinRequests=(p.joinRequests||[]).filter(r=>r.uid!==uid);
        if(members.length!==(p.members||[]).length || joinRequests.length!==(p.joinRequests||[]).length){
            batch.update(doc.ref,{members,joinRequests});
        }
    });
    // Delete payment records
    const paySnap=await db.collection('payments').where('memberUid','==',uid).get();
    paySnap.forEach(doc=>batch.delete(doc.ref));
    // Delete user doc
    batch.delete(db.collection('users').doc(uid));
    await batch.commit();
    alert(name+' has been deleted.');
    loadAdminUsers();
}

async function adminAddToPool(uid,poolId){
    if(!poolId) return;
    const userDoc=await db.collection('users').doc(uid).get();
    const user=userDoc.data();
    const poolDoc=await db.collection('pools').doc(poolId).get();
    const pool=poolDoc.data();
    const members=pool.members||[];
    if(members.find(m=>m.uid===uid||m.email===user.email)){alert(user.name+' is already in this pool.');return;}
    if(members.length>=pool.numMembers){alert('Pool is full.');return;}
    members.push({uid,name:user.name,email:user.email,phone:user.phone||'',won:false,wonMonth:null});
    await db.collection('pools').doc(poolId).update({members});
    alert(user.name+' added to '+pool.name+'!');
}

async function loadAdminAgents(){
    const snap=await db.collection('users').where('role','==','agent').get();
    let html='<div class="card"><h2>Agents</h2>';
    if(snap.empty){html+='<p class="note">No agents yet. Promote users from Users tab.</p>';}
    snap.forEach(doc=>{
        const a=doc.data();
        const stars='\u2605'.repeat(Math.round(a.rating||5))+'\u2606'.repeat(5-Math.round(a.rating||5));
        html+=`<div class="item"><div><b>${a.name}</b><br><span style="font-size:10px">${a.email}</span></div><div><span class="stars">${stars}</span> (${a.rating||5}/5)<br><span style="font-size:10px">Commission: ${Math.max(1,5-Math.round(a.rating||5))}% Admin / ${Math.min(4,Math.round(a.rating||5))}% Agent</span></div></div>`;
    });
    html+='</div>';
    document.getElementById('a-agents').innerHTML=html;
}

async function loadAdminPools(){
    const snap=await db.collection('pools').get();
    let html='<div class="card"><h2>All Chit Pools</h2>';
    if(snap.empty){html+='<p class="note">No pools created yet.</p>';}
    snap.forEach(doc=>{
        const p=doc.data();
        const members=p.members||[];
        const spotsLeft=p.numMembers-members.length;
        const status=p.approved?'<span class="badge b-approved">Active</span>':'<span class="badge b-waiting">Pending</span>';
        const fillStatus=spotsLeft<=0?'<span class="badge b-won">Full</span>':spotsLeft<=3?'<span class="badge b-waiting">'+spotsLeft+' left</span>':'<span class="badge b-approved">'+spotsLeft+' spots</span>';
        html+=`<div class="item" style="cursor:pointer" onclick="openPool('${doc.id}')"><div><b>${p.name}</b> ${status} ${fillStatus}<br><span style="font-size:10px">Agent: ${p.agentName} | ${p.type} | Rs ${p.monthlyAmt.toLocaleString('en-IN')} x ${p.numMembers} | Month ${p.currentMonth||0}/${p.numMembers}</span></div><div style="font-size:18px;color:#006064">&rarr;</div></div>`;
    });
    html+='</div>';
    document.getElementById('a-pools').innerHTML=html;
}

async function loadAdminApprovals(){
    const snap=await db.collection('pools').where('approved','==',false).get();
    let html='<div class="card"><h2>Pending Approvals</h2>';
    if(snap.empty){html+='<p class="note">No pending approvals.</p>';}
    snap.forEach(doc=>{
        const p=doc.data();
        html+=`<div class="item"><div><b>${p.name}</b><br><span style="font-size:10px">${p.agentName} | ${p.type} | Rs ${p.monthlyAmt} x ${p.numMembers}</span></div><div><button class="btn btn-green btn-sm" onclick="approvePool('${doc.id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="rejectPool('${doc.id}')">Reject</button></div></div>`;
    });
    html+='</div>';
    document.getElementById('a-approve').innerHTML=html;
}

async function approvePool(id){await db.collection('pools').doc(id).update({approved:true});loadAdminApprovals();loadAdminPools();}
async function rejectPool(id){if(confirm('Reject this pool?')){await db.collection('pools').doc(id).delete();loadAdminApprovals();}}

// ═══════════════════════════════════════════════════════════
// DELETE POOL (Admin only)
// ═══════════════════════════════════════════════════════════
async function deletePool(poolId){
    if(!confirm('Are you sure you want to DELETE this pool? This cannot be undone.')) return;
    if(!confirm('FINAL WARNING: All pool data, payment records, and history will be permanently deleted.')) return;
    // Delete all payment records for this pool
    const paySnap=await db.collection('payments').where('poolId','==',poolId).get();
    const batch=db.batch();
    paySnap.forEach(doc=>batch.delete(doc.ref));
    batch.delete(db.collection('pools').doc(poolId));
    await batch.commit();
    alert('Pool deleted successfully.');
    renderDashboard();
}

async function updatePoolSetting(field,value){
    await db.collection('pools').doc(currentPoolId).update({[field]:value});
    currentPool[field]=value;
    document.getElementById('poolSettingsMsg').innerHTML='<div class="msg msg-ok">✅ '+field+' updated to: '+value+'</div>';
    setTimeout(()=>{const el=document.getElementById('poolSettingsMsg');if(el)el.innerHTML='';},3000);
}

// ═══════════════════════════════════════════════════════════
// PAYMENT STATUS DASHBOARD (Admin/Agent)
// ═══════════════════════════════════════════════════════════
async function loadPaymentDashboard(){
    const container=document.getElementById('a-payments')||document.getElementById('ag-payments');
    if(!container) return;
    let poolSnap;
    if(UR==='admin'){
        poolSnap=await db.collection('pools').where('approved','==',true).get();
    } else {
        poolSnap=await db.collection('pools').where('agentId','==',CU.uid).get();
    }
    let html='<div class="card"><h2>Payment Status Dashboard</h2>';
    if(poolSnap.empty){html+='<p class="note">No active pools.</p></div>';container.innerHTML=html;return;}

    // Pool selector
    html+=`<div class="row"><label>Select Pool:</label><select id="payDashPool" onchange="loadPaymentGrid()">`;
    poolSnap.forEach(doc=>{
        const p=doc.data();
        html+=`<option value="${doc.id}">${p.name} (Month ${p.currentMonth||0}/${p.numMembers})</option>`;
    });
    html+=`</select></div><div id="paymentGrid"></div></div>`;

async function loadPaymentGrid(){
    const poolId=document.getElementById('payDashPool').value;
    if(!poolId) return;
    const poolDoc=await db.collection('pools').doc(poolId).get();
    const pool=poolDoc.data();
    const members=pool.members||[];
    const completedMonth=pool.currentMonth||0;
    const payableMonth=completedMonth+1; // Current month members should be paying

    // Get all payments for this pool
    const paySnap=await db.collection('payments').where('poolId','==',poolId).get();
    const payments={};
    paySnap.forEach(doc=>{const p=doc.data();const key=p.memberEmail+'_'+p.month;payments[key]=p;});

    let html=`<p style="font-size:11px;margin-bottom:8px;color:#006064"><b>Current payable month: ${payableMonth}</b> (Months completed: ${completedMonth})</p>`;
    html+=`<table class="tbl"><tr><th>Member</th>`;
    for(let m=1;m<=payableMonth;m++) html+=`<th${m===payableMonth?' style="background:#FF6F00"':''}>M${m}${m===payableMonth?' ←':''}</th>`;
    html+=`</tr>`;

    members.forEach(mem=>{
        html+=`<tr><td style="text-align:left;font-weight:600">${mem.name}</td>`;
        for(let m=1;m<=payableMonth;m++){
            const key=mem.email+'_'+m;
            const pay=payments[key];
            if(!pay) html+=`<td><span class="badge b-unpaid">Unpaid</span></td>`;
            else if(pay.status==='approved') html+=`<td><span class="badge b-paid">Paid</span></td>`;
            else if(pay.status==='pending') html+=`<td><span class="badge b-review">Review</span></td>`;
            else html+=`<td><span class="badge b-rejected">Rejected</span></td>`;
        }
        html+=`</tr>`;
    });
    html+=`</table>`;
    document.getElementById('paymentGrid').innerHTML=html;
}

async function loadPendingPayments(){
    let paySnap;
    if(UR==='admin'){
        paySnap=await db.collection('payments').where('status','==','pending').get();
    } else {
        paySnap=await db.collection('payments').where('agentId','==',CU.uid).where('status','==','pending').get();
    }
    const container=document.getElementById('pendingPayments');
    if(!container) return;
    if(paySnap.empty){container.innerHTML='<p class="note">No pending payments to review.</p>';return;}

    let html='';
    paySnap.forEach(doc=>{
        const p=doc.data();
        const proofLink=p.proofUrl?`<a href="${p.proofUrl}" target="_blank" style="color:#006064;font-size:10px">View Proof</a>`:'<span style="font-size:10px;color:#999">No proof</span>';
        const isLate=p.dueDate && new Date(p.submittedAt)>new Date(p.dueDate);
        const lateTag=isLate?'<span class="badge b-rejected">Late</span>':'<span class="badge b-won">On Time</span>';
        html+=`<div class="item"><div><b>${p.memberName}</b> — ${p.poolName} (Month ${p.month}) ${lateTag}<br><span style="font-size:10px">Rs ${p.amount.toLocaleString('en-IN')} | Submitted: ${new Date(p.submittedAt).toLocaleDateString()}</span><br>${proofLink}</div>
        <div><button class="btn btn-green btn-sm" onclick="approvePayment('${doc.id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="rejectPayment('${doc.id}')">Reject</button></div></div>`;
    });
    container.innerHTML=html;
}

async function markPaymentDirect(){
    const poolId=document.getElementById('directPayPool').value;
    const memberSel=document.getElementById('directPayMember');
    const month=parseInt(document.getElementById('directPayMonth').value);
    if(!poolId||!memberSel.value||!month){alert('Fill all fields.');return;}

    const memberEmail=memberSel.value;
    const memberName=memberSel.options[memberSel.selectedIndex].dataset.name;
    const memberUid=memberSel.options[memberSel.selectedIndex].dataset.uid;
    const poolDoc=await db.collection('pools').doc(poolId).get();
    const pool=poolDoc.data();

    // Check if already paid
    const existing=await db.collection('payments')
        .where('poolId','==',poolId)
        .where('memberEmail','==',memberEmail)
        .where('month','==',month)
        .get();
    if(!existing.empty){alert(memberName+' already has a payment record for Month '+month);return;}

    await db.collection('payments').add({
        poolId,
        poolName:pool.name,
        month,
        amount:pool.monthlyAmt,
        memberEmail,
        memberName,
        memberUid,
        agentId:pool.agentId,
        proofUrl:null,
        dueDate:new Date().toISOString(),
        submittedAt:new Date().toISOString(),
        status:'approved',
        reviewedAt:new Date().toISOString(),
        reviewedBy:CU.uid,
        directPayment:true
    });

    // Update rating (on-time)
    const userSnap=await db.collection('users').where('email','==',memberEmail).get();
    if(!userSnap.empty){
        const userDoc=userSnap.docs[0];
        const userData=userDoc.data();
        const newRating=Math.min(5,(userData.rating||5)+1);
        await userDoc.ref.update({rating:newRating,onTime:(userData.onTime||0)+1});
    }

    document.getElementById('directPayMsg').innerHTML='<div class="msg msg-ok">✅ '+memberName+' marked as paid for Month '+month+'</div>';
    loadPaymentGrid();
}

// ═══════════════════════════════════════════════════════════
// APPROVE / REJECT PAYMENT + RATING AUTO-UPDATE
// ═══════════════════════════════════════════════════════════
async function approvePayment(payId){
    const payDoc=await db.collection('payments').doc(payId).get();
    const pay=payDoc.data();
    const isLate=pay.dueDate && new Date(pay.submittedAt)>new Date(pay.dueDate);

    await db.collection('payments').doc(payId).update({status:'approved',reviewedAt:new Date().toISOString(),reviewedBy:CU.uid});

    // Rating auto-update: on-time = +1, late = 0 (no change)
    const userSnap=await db.collection('users').where('email','==',pay.memberEmail).get();
    if(!userSnap.empty){
        const userDoc=userSnap.docs[0];
        const userData=userDoc.data();
        if(isLate){
            // Late: no rating change, increment late count
            await userDoc.ref.update({late:(userData.late||0)+1});
        } else {
            // On-time: +1 rating (max 5), increment onTime count
            const newRating=Math.min(5,(userData.rating||5)+1);
            await userDoc.ref.update({rating:newRating,onTime:(userData.onTime||0)+1});
        }
    }
    loadPendingPayments();
    loadPaymentGrid();
}

async function rejectPayment(payId){
    if(!confirm('Reject this payment? Member rating will decrease by 1.')) return;
    const payDoc=await db.collection('payments').doc(payId).get();
    const pay=payDoc.data();

    await db.collection('payments').doc(payId).update({status:'rejected',reviewedAt:new Date().toISOString(),reviewedBy:CU.uid});

    // Rating auto-update: rejected = -1
    const userSnap=await db.collection('users').where('email','==',pay.memberEmail).get();
    if(!userSnap.empty){
        const userDoc=userSnap.docs[0];
        const userData=userDoc.data();
        const newRating=Math.max(1,(userData.rating||5)-1);
        await userDoc.ref.update({rating:newRating,late:(userData.late||0)+1});
    }
    loadPendingPayments();
    loadPaymentGrid();
}

        <div id="poolSettingsMsg"></div></div>`;

    <div id="joinRequests"></div>
    <div id="poolMembersList"></div></div>`;

        <div class="lottery-box"><h3>Month ${month} Draw</h3>

async function addToPool(){
    const email=document.getElementById('poolMemEmail').value.trim();
    if(!email){alert('Enter email.');return;}
    const snap=await db.collection('users').where('email','==',email).get();
    if(snap.empty){alert('User not found. Ask them to register.');return;}
    const user=snap.docs[0].data();
    const members=currentPool.members||[];
    if(members.find(m=>m.email===email)){alert('Already in pool.');return;}
    if(members.length>=currentPool.numMembers){alert('Pool is full.');return;}
    members.push({uid:snap.docs[0].id,name:user.name,email:user.email,phone:user.phone||'',won:false,wonMonth:null});
    await db.collection('pools').doc(currentPoolId).update({members});
    currentPool.members=members;
    document.getElementById('poolMemEmail').value='';
    loadPoolMembers();
    if(currentPool.type==='bid') loadBidEligible();
}

function loadPoolMembers(){
    const members=currentPool.members||[];
    let html='';
    members.forEach((m,i)=>{
        const badge=m.won?'<span class="badge b-won">Won M'+m.wonMonth+'</span>':'<span class="badge b-pending">Pending</span>';
        const removeBtn=(UR==='admin'||UR==='agent')?`<button class="btn btn-red btn-sm" onclick="removeFromPool(${i},'${m.name}')" style="margin-left:4px">✕</button>`:'';
        html+=`<div class="item"><div>${i+1}. <b>${m.name}</b> ${badge}<br><span style="font-size:10px">${m.phone||m.email}</span></div><div><button class="btn btn-wa btn-sm" onclick="waRemind('${m.name}','${m.phone}')">WA</button>${removeBtn}</div></div>`;
    });
    document.getElementById('poolMembersList').innerHTML=html||'<p class="note">No members in pool yet.</p>';

    // Show join requests
    const requests=currentPool.joinRequests||[];
    let rhtml='';
    if(requests.length>0){
        rhtml='<div style="background:#FFF3E0;border-radius:8px;padding:10px;margin-bottom:10px"><b style="font-size:11px;color:#E65100">Join Requests ('+requests.length+'):</b>';
        requests.forEach((r,i)=>{
            rhtml+=`<div class="item"><div><b>${r.name}</b><br><span style="font-size:10px">${r.email}</span></div><div><button class="btn btn-green btn-sm" onclick="approveJoin(${i})">Accept</button> <button class="btn btn-red btn-sm" onclick="rejectJoin(${i})">Reject</button></div></div>`;
        });
        rhtml+='</div>';
    }
    document.getElementById('joinRequests').innerHTML=rhtml;
}

async function approveJoin(idx){
    const requests=currentPool.joinRequests||[];
    const r=requests[idx];
    const members=currentPool.members||[];
    if(members.length>=currentPool.numMembers){alert('Pool is full!');return;}
    members.push({uid:r.uid,name:r.name,email:r.email,phone:r.phone||'',won:false,wonMonth:null});
    requests.splice(idx,1);
    await db.collection('pools').doc(currentPoolId).update({members,joinRequests:requests});
    currentPool.members=members;
    currentPool.joinRequests=requests;

    // Notify the new member
    await db.collection('notifications').add({
        type:'member_joined',
        message:'Welcome! You have been added to "'+currentPool.name+'". Monthly: Rs '+currentPool.monthlyAmt.toLocaleString('en-IN')+' | Type: '+currentPool.type,
        poolId:currentPoolId,
        targetUid:r.uid,
        forAdmin:false,
        read:false,
        createdAt:new Date().toISOString()
    });

    // Notify all existing members about new joiner
    for(const m of members){
        if(m.uid!==r.uid){
            await db.collection('notifications').add({
                type:'member_joined',
                message:r.name+' has joined "'+currentPool.name+'" ('+members.length+'/'+currentPool.numMembers+' members now)',
                poolId:currentPoolId,
                targetUid:m.uid,
                forAdmin:false,
                read:false,
                createdAt:new Date().toISOString()
            });
        }
    }

    loadPoolMembers();
    if(currentPool.type==='bid') loadBidEligible();
}

async function rejectJoin(idx){
    const requests=currentPool.joinRequests||[];
    requests.splice(idx,1);
    await db.collection('pools').doc(currentPoolId).update({joinRequests:requests});
    currentPool.joinRequests=requests;
    loadPoolMembers();
}

async function removeFromPool(idx,name){
    if(!confirm('Remove "'+name+'" from this pool?')) return;
    const members=currentPool.members||[];
    members.splice(idx,1);
    await db.collection('pools').doc(currentPoolId).update({members});
    currentPool.members=members;
    loadPoolMembers();
    if(currentPool.type==='bid') loadBidEligible();
}

function waRemind(name,phone){
    if(!phone){alert('No phone for '+name);return;}
    const p=phone.replace(/[^0-9]/g,'');
    const month=(currentPool.currentMonth||0)+1;
    const msg=encodeURIComponent('Hi '+name+',\n\nYour Chittly payment of Rs '+currentPool.monthlyAmt.toLocaleString('en-IN')+' for Month '+month+' is due.\n\nPlease pay at the earliest.\n\n- '+UD.name);
    window.open('https://wa.me/'+p+'?text='+msg,'_blank');
}

// LOTTERY
async function runLottery(){
    const eligible=(currentPool.members||[]).filter(m=>!m.won);
    if(eligible.length===0){alert('All members have won!');return;}
    const btn=document.getElementById('lotteryBtn');
    const spinner=document.getElementById('spinnerText');
    btn.disabled=true;

    let count=0;
    const interval=setInterval(()=>{
        const rand=eligible[Math.floor(Math.random()*eligible.length)];
        spinner.textContent=rand.name;
        count++;
        if(count>20){
            clearInterval(interval);
            const winner=eligible[Math.floor(Math.random()*eligible.length)];
            spinner.textContent='🎉 '+winner.name+' 🎉';
            spinner.style.fontSize='24px';
            saveLotteryResult(winner);
            btn.disabled=false;
        }
    },150);
}

async function saveLotteryResult(winner){
    const month=(currentPool.currentMonth||0)+1;
    const pool=currentPool.numMembers*currentPool.monthlyAmt;
    const comm=pool*currentPool.commission/100;
    const payout=pool-comm;

    const members=currentPool.members;
    const idx=members.findIndex(m=>m.email===winner.email);
    members[idx].won=true;
    members[idx].wonMonth=month;

    const bids=currentPool.bids||[];
    bids.push({month,winner:winner.name,type:'lottery',payout,commission:comm,date:new Date().toISOString()});

    await db.collection('pools').doc(currentPoolId).update({members,bids,currentMonth:month});
    currentPool.members=members;
    currentPool.bids=bids;
    currentPool.currentMonth=month;

    document.getElementById('lotteryResult').innerHTML=`<div class="msg msg-ok"><b>Winner: ${winner.name}</b><br>Receives: Rs ${payout.toLocaleString('en-IN')} (after ${currentPool.commission}% commission)</div>`;
    loadPoolMembers();
    loadPoolHistory();
}

// BID — Show all submitted bids to admin and let them pick winner
async function loadBidSubmissions(){
    const container=document.getElementById('bidSubmissions');
    if(!container) return;
    const month=(currentPool.currentMonth||0)+1;
    const poolTotal=currentPool.numMembers*currentPool.monthlyAmt;
    const comm=poolTotal*currentPool.commission/100;
    const eligible=(currentPool.members||[]).filter(m=>!m.won);
    const minBid=currentPool.minBid||0;

    // Fetch all member bids for this month
    const bidSnap=await db.collection('memberBids')
        .where('poolId','==',currentPoolId)
        .where('month','==',month)
        .get();

    let memberBids=[];
    bidSnap.forEach(doc=>{memberBids.push(doc.data());});

    // Sort by bid amount (lowest first)
    memberBids.sort((a,b)=>a.bidAmount-b.bidAmount);

    let html=`<p style="font-size:11px;margin-bottom:8px"><b>Pool Total:</b> Rs ${poolTotal.toLocaleString('en-IN')} | <b>Commission:</b> Rs ${comm.toLocaleString('en-IN')} (${currentPool.commission}%) | <b>Min Bid:</b> Rs ${minBid.toLocaleString('en-IN')}</p>`;
    html+=`<p style="font-size:11px;margin-bottom:8px"><b>Eligible:</b> ${eligible.length} members | <b>Bids received:</b> ${memberBids.length}</p>`;

    if(memberBids.length>0){
        html+=`<table class="tbl"><tr><th>#</th><th>Member</th><th>Bid Amount</th><th>Time</th>${(UR==='admin'||UR==='agent')?'<th>Action</th>':''}</tr>`;
        memberBids.forEach((b,i)=>{
            const isLowest=i===0;
            const highlight=isLowest?'style="background:#E8F5E9;font-weight:700"':'';
            html+=`<tr ${highlight}><td>${i+1}</td><td>${b.memberName}${isLowest?' ⭐':''}</td><td>Rs ${b.bidAmount.toLocaleString('en-IN')}</td><td>${new Date(b.submittedAt).toLocaleDateString('en-IN')}</td>`;
            if(UR==='admin'||UR==='agent'){
                html+=`<td><button class="btn btn-green btn-sm" onclick="selectBidWinner('${b.memberEmail}','${b.memberName}',${b.bidAmount})">Select Winner</button></td>`;
            }
            html+=`</tr>`;
        });
        html+=`</table>`;

        // Show members who haven't bid (they get minBid)
        const biddedEmails=memberBids.map(b=>b.memberEmail);
        const nonBidders=eligible.filter(m=>!biddedEmails.includes(m.email));
        if(nonBidders.length>0){
            html+=`<p style="font-size:11px;color:#E65100;margin-top:8px"><b>Non-bidders (will get min bid Rs ${minBid.toLocaleString('en-IN')}):</b> ${nonBidders.map(m=>m.name).join(', ')}</p>`;
        }
    } else {
        html+=`<p class="note">No bids submitted yet for Month ${month}.</p>`;
        // Manual fallback for admin
        if(UR==='admin'||UR==='agent'){
            html+=`<div class="row" style="margin-top:8px"><label>Winner:</label><select id="bidWinnerManual">`;
            eligible.forEach(m=>{html+=`<option value="${m.email}" data-name="${m.name}">${m.name}</option>`;});
            html+=`</select></div>`;
            html+=`<div class="row"><label>Bid Amt:</label><input type="number" id="bidAmtManual" placeholder="Rs" style="max-width:120px"></div>`;
            html+=`<button class="btn btn-gold btn-sm" onclick="manualBidWinner()">Process Manually</button>`;
        }
    }
    container.innerHTML=html;
}

async function selectBidWinner(winnerEmail,winnerName,bidAmt){
    if(!confirm('Declare '+winnerName+' as winner with bid Rs '+bidAmt.toLocaleString('en-IN')+'?')) return;
    await finalizeBidWinner(winnerEmail,winnerName,bidAmt);
}

async function manualBidWinner(){
    const sel=document.getElementById('bidWinnerManual');
    const winnerEmail=sel.value;
    const winnerName=sel.options[sel.selectedIndex].dataset.name;
    const bidAmt=parseInt(document.getElementById('bidAmtManual').value);
    if(!winnerEmail||!bidAmt){alert('Select winner and enter bid amount.');return;}
    await finalizeBidWinner(winnerEmail,winnerName,bidAmt);
}

async function finalizeBidWinner(winnerEmail,winnerName,bidAmt){
    const month=(currentPool.currentMonth||0)+1;
    const poolTotal=currentPool.numMembers*currentPool.monthlyAmt;
    const comm=poolTotal*currentPool.commission/100;
    const numMembers=currentPool.numMembers;

    // Dividend = (Pool - Bid - Commission) / Total Members
    const dividend=Math.round((poolTotal-bidAmt-comm)/numMembers);
    const netPayment=currentPool.monthlyAmt-dividend;

    // Mark winner
    const members=currentPool.members;
    const idx=members.findIndex(m=>m.email===winnerEmail);
    if(idx<0){alert('Member not found.');return;}
    members[idx].won=true;
    members[idx].wonMonth=month;

    // Save bid result
    const bids=currentPool.bids||[];
    bids.push({
        month,
        winner:winnerName,
        winnerEmail,
        type:'bid',
        bidAmt,
        poolTotal,
        commission:comm,
        dividend,
        netPayment,
        numMembers,
        date:new Date().toISOString()
    });

    await db.collection('pools').doc(currentPoolId).update({members,bids,currentMonth:month});
    currentPool.members=members;
    currentPool.bids=bids;
    currentPool.currentMonth=month;

    // Notify all members about the result
    for(const m of members){
        const isWinner=m.email===winnerEmail;
        const msg=isWinner
            ?'🎉 Congratulations! You won the bid for "'+currentPool.name+'" Month '+month+'! Bid: Rs '+bidAmt.toLocaleString('en-IN')
            :'📢 '+currentPool.name+' Month '+month+' Result: Winner is '+winnerName+' (Bid: Rs '+bidAmt.toLocaleString('en-IN')+'). Your dividend: Rs '+dividend.toLocaleString('en-IN')+'. Net payment: Rs '+netPayment.toLocaleString('en-IN');
        await db.collection('notifications').add({
            type:'bid_result',
            message:msg,
            poolId:currentPoolId,
            targetUid:m.uid,
            forAdmin:false,
            read:false,
            createdAt:new Date().toISOString()
        });
    }

    document.getElementById('bidResult').innerHTML=`<div class="msg msg-ok"><b>🎉 Winner: ${winnerName}</b><br>Bid: Rs ${bidAmt.toLocaleString('en-IN')} | Dividend: Rs ${dividend}/member | Net Payment: Rs ${netPayment}/member<br><span style="font-size:10px">All members notified.</span></div>`;
    loadPoolMembers();
    loadBidSubmissions();
    loadPoolHistory();
    loadMonthlyResults();
}

// Monthly Results — visible to ALL (admin, agent, members when they open pool)

    const container=document.getElementById('monthlyResults');
    if(!container) return;
    const bids=currentPool.bids||[];

        } else {

        } else {

function mTab(el,id){

    el.classList.add('active');
    document.getElementById(id).classList.add('active');
    if(id==='m-my')loadMyPools();
    if(id==='m-bid')loadMemberBids();

async function loadMyPools(){
    const snap=await db.collection('pools').where('approved','==',true).get();
    let myPools=[];
    snap.forEach(doc=>{
        const p=doc.data();
        if((p.members||[]).find(m=>m.email===CU.email)){
            myPools.push({id:doc.id,...p});
        }
    });

    let html='';
    if(myPools.length===0){
        html='<div class="card"><p class="note">You are not part of any pool yet. Browse available pools to join one.</p></div>';
    }
    for(const pool of myPools){
        const me=(pool.members||[]).find(m=>m.email===CU.email);
        const status=me&&me.won?'<span class="badge b-won">Won Month '+me.wonMonth+'</span>':'<span class="badge b-pending">Not yet won</span>';
        const completedMonth=pool.currentMonth||0;
        const payableMonth=completedMonth+1;
        const dueDay=pool.dueDay||5;
        const now=new Date();
        const dueDate=new Date(now.getFullYear(),now.getMonth(),dueDay);
        if(now>dueDate) dueDate.setMonth(dueDate.getMonth()+1);
        const daysLeft=Math.ceil((dueDate-now)/(1000*60*60*24));
        const dueDateStr=dueDate.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

        html+=`<div class="card"><h2>${pool.name}</h2>
        <div class="due-date-box"><div class="icon">📅</div><div class="info"><b>Due: ${dueDateStr} (Month ${payableMonth})</b>${daysLeft<=3?'<span style="color:#FFD700;font-weight:700"> ('+daysLeft+' days left!)</span>':' ('+daysLeft+' days left)'}</div></div>
        <div class="sg"><div class="sc"><div class="v">Rs ${pool.monthlyAmt.toLocaleString('en-IN')}</div><div class="l">Monthly</div></div><div class="sc"><div class="v">${completedMonth}/${pool.numMembers}</div><div class="l">Months Done</div></div></div>
        <p style="font-size:12px"><b>Type:</b> ${pool.type} | <b>Status:</b> ${status} | <b>Next Payment:</b> Month ${payableMonth}</p>`;

        // Show ALL previous results (bid/won history)
        const bids=pool.bids||[];
        if(bids.length>0){
            html+=`<div style="margin-top:10px;background:#f9f9f9;border-radius:8px;padding:10px">
            <b style="font-size:11px;color:#006064">📊 Past Results:</b>
            <table class="tbl" style="margin-top:6px"><tr><th>Month</th><th>Winner</th>`;
            if(pool.type==='bid') html+=`<th>Bid</th><th>Dividend</th><th>Net Pay</th>`;
            else html+=`<th>Payout</th>`;
            html+=`</tr>`;
            bids.forEach(b=>{
                const isMe=b.winnerEmail===CU.email||b.winner===UD.name;
                const highlight=isMe?'style="background:#E8F5E9;font-weight:700"':'';
                if(b.type==='bid'){
                    html+=`<tr ${highlight}><td>M${b.month}</td><td>${b.winner}${isMe?' 🎉':''}</td><td>Rs ${b.bidAmt.toLocaleString('en-IN')}</td><td style="color:#2E7D32">Rs ${(b.dividend||0).toLocaleString('en-IN')}</td><td>Rs ${(b.netPayment||0).toLocaleString('en-IN')}</td></tr>`;
                } else {
                    html+=`<tr ${highlight}><td>M${b.month}</td><td>${b.winner}${isMe?' 🎉':''}</td><td>Rs ${(b.payout||0).toLocaleString('en-IN')}</td></tr>`;
                }
            });
            html+=`</table></div>`;
        }
        html+=`</div>`;
    }
    document.getElementById('m-my').innerHTML=html;
}

// ═══════════════════════════════════════════════════════════
async function loadMemberBids(){
    const snap=await db.collection('pools').where('approved','==',true).get();
    let myBidPools=[];
    snap.forEach(doc=>{
        const p=doc.data();
        if(p.type==='bid' && (p.members||[]).find(m=>m.email===CU.email)){
            myBidPools.push({id:doc.id,...p});
        }
    });

    let html='';
    if(myBidPools.length===0){
        html='<div class="card"><p class="note">You are not part of any bid-type pool. Only bid pools allow member bidding.</p></div>';
        document.getElementById('m-bid').innerHTML=html;
        return;
    }

    for(const pool of myBidPools){
        const me=(pool.members||[]).find(m=>m.email===CU.email);
        const currentMonth=(pool.currentMonth||0)+1;
        const poolTotal=pool.numMembers*pool.monthlyAmt;
        const comm=poolTotal*pool.commission/100;
        const maxBid=poolTotal-comm;
        const minBid=pool.minBid||0;
        const hasWon=me&&me.won;

        html+=`<div class="card"><h2>${pool.name} — Month ${currentMonth} Bid</h2>`;

        // Disclaimer for bid type
        html+=`<div style="background:#FFF8E1;border:1px solid #FFD54F;border-radius:8px;padding:10px;margin-bottom:10px">
        <b style="font-size:11px;color:#F57F17">📋 BID POOL RULES:</b>
        <ul style="font-size:10px;color:#555;margin:6px 0 0 16px;line-height:1.7">
        <li>The <b>lowest bidder</b> wins the pool amount for this month.</li>
        <li>Pool total: Rs ${poolTotal.toLocaleString('en-IN')} | Commission: ${pool.commission}%</li>
        <li><b>Minimum bid: Rs ${minBid.toLocaleString('en-IN')}</b> (set by Admin)</li>
        <li>Maximum bid allowed: Rs ${maxBid.toLocaleString('en-IN')} (pool minus commission)</li>
        <li><b>Members who do not submit a bid will be assigned the minimum bid (Rs ${minBid.toLocaleString('en-IN')}) automatically.</b></li>
        <li>The difference (pool - bid - commission) is distributed as dividend to all members.</li>
        <li>Each member can win only <b>once</b> during the entire chit duration.</li>
        <li>Once you bid, it cannot be changed. Agent/Admin selects the lowest bid as winner.</li>
        <li>All members must pay their monthly contribution regardless of bidding.</li>
        </ul></div>`;

        if(hasWon){
            html+=`<div class="msg msg-ok">✅ You have already won in Month ${me.wonMonth}. No more bids needed.</div>`;
        } else {
            // Check if already bid this month
            const bidSnap=await db.collection('memberBids')
                .where('poolId','==',pool.id)
                .where('memberEmail','==',CU.email)
                .where('month','==',currentMonth)
                .get();

            if(!bidSnap.empty){
                const existingBid=bidSnap.docs[0].data();
                html+=`<div class="msg" style="background:#E3F2FD;color:#1565C0">📝 Your bid for Month ${currentMonth}: <b>Rs ${existingBid.bidAmount.toLocaleString('en-IN')}</b><br><span style="font-size:10px">Submitted: ${new Date(existingBid.submittedAt).toLocaleString('en-IN')}</span></div>`;
            } else {
                html+=`<div class="row"><label>Your Bid (Rs):</label><input type="number" id="bidInput_${pool.id}" placeholder="Min: Rs ${minBid.toLocaleString('en-IN')}" min="${minBid}" max="${maxBid}" style="max-width:150px"></div>
                <p class="note">Enter the amount you want to receive (Min: Rs ${minBid.toLocaleString('en-IN')}). Lower bid = higher chance of winning.</p>
                <button class="btn btn-gold btn-full" onclick="submitMemberBid('${pool.id}','${pool.name}',${currentMonth},${maxBid},${minBid})">Submit My Bid</button>`;
            }
        }

        // Show all bids for this month (anonymized for fairness — only show count)
        const allBidsSnap=await db.collection('memberBids')
            .where('poolId','==',pool.id)
            .where('month','==',currentMonth)
            .get();
        html+=`<p class="note" style="margin-top:10px">Bids received this month: ${allBidsSnap.size}/${(pool.members||[]).filter(m=>!m.won).length} eligible members</p>`;

        html+=`<div id="bidMsg_${pool.id}"></div></div>`;
    }
    document.getElementById('m-bid').innerHTML=html;
}

async function submitMemberBid(poolId,poolName,month,maxBid,minBid){
    const input=document.getElementById('bidInput_'+poolId);
    const bidAmount=parseInt(input.value);
    if(!bidAmount||bidAmount<1){alert('Enter a valid bid amount.');return;}
    if(minBid && bidAmount<minBid){alert('Bid cannot be less than minimum: Rs '+minBid.toLocaleString('en-IN'));return;}
    if(bidAmount>maxBid){alert('Bid cannot exceed Rs '+maxBid.toLocaleString('en-IN'));return;}

    // Check if already bid
    const existing=await db.collection('memberBids')
        .where('poolId','==',poolId)
        .where('memberEmail','==',CU.email)
        .where('month','==',month)
        .get();
    if(!existing.empty){alert('You have already submitted a bid for this month.');return;}

    await db.collection('memberBids').add({
        poolId,
        poolName,
        month,
        bidAmount,
        memberEmail:CU.email,
        memberName:UD.name,
        memberUid:CU.uid,
        submittedAt:new Date().toISOString()
    });

    // Notify agent/admin
    const poolDoc=await db.collection('pools').doc(poolId).get();
    const pool=poolDoc.data();
    await db.collection('notifications').add({
        type:'bid_submitted',
        message:UD.name+' submitted a bid of Rs '+bidAmount.toLocaleString('en-IN')+' for '+poolName+' (Month '+month+')',
        poolId,
        targetUid:pool.agentId,
        forAdmin:true,
        read:false,
        createdAt:new Date().toISOString()
    });

    document.getElementById('bidMsg_'+poolId).innerHTML='<div class="msg msg-ok">✅ Bid submitted: Rs '+bidAmount.toLocaleString('en-IN')+'</div>';
    setTimeout(()=>loadMemberBids(),1500);
}

// MEMBER NOTIFICATIONS
// ═══════════════════════════════════════════════════════════
async function loadMemberNotifications(){
    const snap=await db.collection('notifications')
        .where('targetUid','==',CU.uid)
        .orderBy('createdAt','desc')
        .limit(20)
        .get();

    let html='<div class="card"><h2>Notifications</h2>';
    if(snap.empty){html+='<p class="note">No notifications yet.</p>';}
    snap.forEach(doc=>{
        const n=doc.data();
        const icon=n.type==='member_joined'?'👋':n.type==='bid_submitted'?'📝':n.type==='payment_approved'?'✅':n.type==='payment_rejected'?'❌':'🔔';
        const readStyle=n.read?'opacity:0.6':'';
        const time=new Date(n.createdAt).toLocaleString('en-IN');
        html+=`<div class="item" style="${readStyle}"><div>${icon} ${n.message}<br><span style="font-size:9px;color:#999">${time}</span></div></div>`;
    });
    html+='</div>';
    document.getElementById('m-notif').innerHTML=html;

    // Mark all as read
    snap.forEach(doc=>{
        if(!doc.data().read) db.collection('notifications').doc(doc.id).update({read:true});
    });
}

async function loadBrowsePools(){
    const snap=await db.collection('pools').where('approved','==',true).get();
    let html='<div class="card"><h2>Available Pools</h2>';
    if(snap.empty){html+='<p class="note">No pools available right now.</p></div>';document.getElementById('m-browse').innerHTML=html;return;}

    snap.forEach(doc=>{
        const p=doc.data();
        const members=p.members||[];
        const isMember=members.find(m=>m.email===CU.email);
        const spotsLeft=p.numMembers-members.length;
        const isFull=spotsLeft<=0;

        let statusBadge='';
        if(isFull) statusBadge='<span class="badge b-won">Full</span>';
        else if(spotsLeft<=3) statusBadge='<span class="badge b-waiting">Filling Fast! '+spotsLeft+' left</span>';
        else statusBadge='<span class="badge b-approved">Open ('+spotsLeft+' spots)</span>';

        let joinBtn='';
        if(isMember) joinBtn='<span style="font-size:10px;color:#2E7D32;font-weight:600">✓ Joined</span>';
        else if(isFull) joinBtn='<span style="font-size:10px;color:#999">Full</span>';
        else{
            const requested=(p.joinRequests||[]).find(r=>r.email===CU.email);
            if(requested) joinBtn='<span style="font-size:10px;color:#E65100">⏳ Request Pending</span>';
            else joinBtn=`<button class="btn btn-green btn-sm" onclick="requestJoin('${doc.id}')">Join</button>`;
        }

        html+=`<div class="item"><div><b>${p.name}</b> ${statusBadge}<br><span style="font-size:10px">${p.type} | Rs ${p.monthlyAmt.toLocaleString('en-IN')}/month | ${members.length}/${p.numMembers} members</span><br><span style="font-size:10px;color:#777">Agent: ${p.agentName}</span></div><div>${joinBtn}</div></div>`;
    });
    html+='</div>';
    document.getElementById('m-browse').innerHTML=html;
}

async function requestJoin(poolId){
    const doc=await db.collection('pools').doc(poolId).get();
    const pool=doc.data();

    // Show disclaimer based on pool type
    let disclaimer='';
    if(pool.type==='bid'){
        disclaimer='BID POOL RULES:\n\n'+
        '1. The lowest bidder wins the pool amount each month.\n'+
        '2. Pool total = Members × Monthly amount.\n'+
        '3. Commission ('+pool.commission+'%) is deducted from the pool.\n'+
        '4. Remaining difference is distributed as dividend to all members.\n'+
        '5. Each member can win only ONCE during the chit.\n'+
        '6. Monthly payment is mandatory regardless of bidding.\n'+
        '7. Late payments affect your rating.\n'+
        '8. Defaulting may result in removal from the pool.\n\n'+
        'Do you agree to these terms and want to join?';
    } else {
        disclaimer='LOTTERY POOL RULES:\n\n'+
        '1. Winner is selected RANDOMLY each month by lottery draw.\n'+
        '2. Pool total = Members × Monthly amount.\n'+
        '3. Commission ('+pool.commission+'%) is deducted from the pool.\n'+
        '4. Winner receives the full pool amount minus commission.\n'+
        '5. Each member can win only ONCE during the chit.\n'+
        '6. Monthly payment is mandatory for all members.\n'+
        '7. Late payments affect your rating.\n'+
        '8. Defaulting may result in removal from the pool.\n\n'+
        'Do you agree to these terms and want to join?';
    }

    if(!confirm(disclaimer)) return;

    const requests=pool.joinRequests||[];
    if(requests.find(r=>r.email===CU.email)){alert('Already requested.');return;}
    requests.push({uid:CU.uid,name:UD.name,email:CU.email,phone:UD.phone||'',requestedAt:new Date().toISOString()});
    await db.collection('pools').doc(poolId).update({joinRequests:requests});

    // Notify agent about join request
    await db.collection('notifications').add({
        type:'join_request',
        message:UD.name+' has requested to join "'+pool.name+'"',
        poolId,
        targetUid:pool.agentId,
        forAdmin:true,
        read:false,
        createdAt:new Date().toISOString()
    });

    alert('Join request sent! The agent will review it.');
    loadBrowsePools();
}

// MEMBER PAYMENT — Upload proof, track status
// Shows the NEXT month to pay (currentMonth + 1) and all unpaid previous months
// ═══════════════════════════════════════════════════════════
async function loadMemberPayment(){
    const snap=await db.collection('pools').where('approved','==',true).get();
    let myPools=[];
    snap.forEach(doc=>{
        const p=doc.data();
        if((p.members||[]).find(m=>m.email===CU.email)){
            myPools.push({id:doc.id,...p});
        }
    });

    let html='';
    if(myPools.length===0){
        html='<div class="card"><p class="note">Join a pool first to make payments.</p></div>';
        document.getElementById('m-pay').innerHTML=html;
        return;
    }

    for(const pool of myPools){
        // The month the member needs to pay for is currentMonth + 1
        // (currentMonth = last completed bid/lottery month)
        // If currentMonth is 0 (no bid done yet), they still need to pay month 1
        const completedMonth=pool.currentMonth||0;
        const payableMonth=completedMonth+1; // The upcoming month to pay for
        const totalMonths=pool.numMembers;
        const dueDay=pool.dueDay||5;
        const now=new Date();
        const dueDate=new Date(now.getFullYear(),now.getMonth(),dueDay);
        if(now>dueDate) dueDate.setMonth(dueDate.getMonth()+1);
        const dueDateStr=dueDate.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

        // Get ALL payments by this member for this pool
        const allPaySnap=await db.collection('payments')
            .where('poolId','==',pool.id)
            .where('memberEmail','==',CU.email)
            .get();
        const paymentsByMonth={};
        allPaySnap.forEach(doc=>{
            const p=doc.data();
            paymentsByMonth[p.month]=p;
        });

        html+=`<div class="card"><h2>${pool.name} — Payment</h2>
        <div class="due-date-box"><div class="icon">📅</div><div class="info"><b>Due: ${dueDateStr}</b><br>Amount: Rs ${pool.monthlyAmt.toLocaleString('en-IN')} | Month ${payableMonth} of ${totalMonths}</div></div>`;

        // Show payment status for the CURRENT payable month
        const currentPay=paymentsByMonth[payableMonth];
        const payStatus=currentPay?currentPay.status:'unpaid';

        html+=`<h3 style="font-size:13px;color:#006064;margin:12px 0 8px">Month ${payableMonth} Payment</h3>`;

        if(payStatus==='approved'){
            html+=`<div class="msg msg-ok" style="margin-top:10px">✅ Payment approved for Month ${payableMonth}</div>`;
        } else if(payStatus==='pending'){
            html+=`<div class="msg" style="background:#FFF3E0;color:#E65100;margin-top:10px">⏳ Payment proof submitted — awaiting review</div>`;
            if(currentPay&&currentPay.proofUrl){
                html+=`<img src="${currentPay.proofUrl}" class="proof-img" alt="Payment proof">`;
            }
        } else if(payStatus==='rejected'){
            html+=`<div class="msg msg-err" style="margin-top:10px">❌ Payment was rejected. Please re-upload correct proof.</div>`;
            html+=renderUploadBox(pool.id,payableMonth,pool);
        } else {
            html+=renderUploadBox(pool.id,payableMonth,pool);
        }

        // Show any UNPAID previous months (months 1 to payableMonth-1 that are not approved)
        let unpaidMonths=[];
        for(let m=1;m<payableMonth;m++){
            const prev=paymentsByMonth[m];
            if(!prev || prev.status==='rejected'){
                unpaidMonths.push(m);
            }
        }
        if(unpaidMonths.length>0){
            html+=`<div style="background:#FFEBEE;border:1px solid #EF9A9A;border-radius:8px;padding:10px;margin-top:12px">
            <b style="font-size:11px;color:#C62828">⚠️ Overdue Payments:</b>
            <p style="font-size:11px;color:#555;margin-top:4px">You have unpaid months: ${unpaidMonths.map(m=>'Month '+m).join(', ')}</p></div>`;
            // Allow uploading for each unpaid previous month
            for(const m of unpaidMonths){
                html+=`<div style="border:1px solid #e0e0e0;border-radius:8px;padding:10px;margin-top:8px">
                <p style="font-size:12px;font-weight:600;color:#D32F2F">Month ${m} — Overdue</p>`;
                html+=renderUploadBox(pool.id,m,pool);
                html+=`</div>`;
            }
        }

        html+=`</div>`;

        // Payment history grid for all months (shows complete picture)
        html+=`<div class="card"><h2>${pool.name} — Payment History</h2>`;
        html+=`<div class="payment-grid">`;
        for(let m=1;m<=Math.max(payableMonth,completedMonth);m++){
            const pay=paymentsByMonth[m];
            let cellClass='unpaid';
            let cellText='Unpaid';
            if(pay){
                if(pay.status==='approved'){cellClass='paid';cellText='✅ Paid';}
                else if(pay.status==='pending'){cellClass='review';cellText='⏳ Review';}
                else if(pay.status==='rejected'){cellClass='rejected';cellText='❌ Rejected';}
            }
            const isCurrentMonth=m===payableMonth;
            html+=`<div class="payment-cell ${cellClass}" ${isCurrentMonth?'style="border-width:3px"':''}>
            <div style="font-weight:600;margin-bottom:3px">Month ${m}</div>
            <div style="font-size:10px">${cellText}</div>
            ${isCurrentMonth?'<div style="font-size:9px;color:#006064;margin-top:2px">← Current</div>':''}
            </div>`;
        }
        html+=`</div></div>`;

        // Bid/Lottery results history (previous months data)
        const bids=pool.bids||[];
        if(bids.length>0){
            html+=`<div class="card"><h2>${pool.name} — Bid/Lottery History</h2>
            <table class="tbl"><tr><th>Month</th><th>Winner</th><th>Type</th><th>Bid/Payout</th><th>Dividend</th></tr>`;
            bids.forEach(b=>{
                if(b.type==='bid'){
                    html+=`<tr><td>${b.month}</td><td><b>${b.winner}</b></td><td>Bid</td><td>Rs ${b.bidAmt.toLocaleString('en-IN')}</td><td style="color:#2E7D32">Rs ${(b.dividend||0).toLocaleString('en-IN')}</td></tr>`;
                } else {
                    html+=`<tr><td>${b.month}</td><td><b>${b.winner}</b></td><td>Lottery</td><td colspan="2">Payout: Rs ${(b.payout||0).toLocaleString('en-IN')}</td></tr>`;
                }
            });
            html+=`</table></div>`;
        }
    }
    document.getElementById('m-pay').innerHTML=html;
}

function renderUploadBox(poolId,month,pool){
    const boxId='upload_'+poolId+'_'+month;
    const qrHtml=pool.qrUrl?`<div style="text-align:center;margin:10px 0"><p style="font-size:11px;font-weight:600;color:#006064;margin-bottom:6px">📱 Scan QR to Pay:</p><img src="${pool.qrUrl}" style="max-width:180px;border-radius:8px;border:2px solid #e0e0e0" alt="Payment QR"></div>`:'';
    const upiHtml=pool.upiId?`<p style="text-align:center;font-size:12px;margin:6px 0"><b>UPI ID:</b> <span style="color:#006064;font-weight:600">${pool.upiId}</span></p>`:'';
    const upiBtn=pool.upiId?`<a href="upi://pay?pa=${pool.upiId}&pn=${encodeURIComponent(pool.agentName||'Chittly')}&am=${pool.monthlyAmt}&cu=INR&tn=${encodeURIComponent(pool.name+' Month '+month+' Payment')}" style="display:block;text-align:center;background:#5C6BC0;color:#fff;padding:12px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;margin:10px 0">💳 Pay Rs ${pool.monthlyAmt.toLocaleString('en-IN')} via UPI</a>`:'';
    return `${qrHtml}${upiHtml}${upiBtn}
    <div class="payment-proof-box" onclick="document.getElementById('file_${boxId}').click()">
        <div class="upload-icon">📷</div>
        <p>Tap to upload payment proof</p>
        <p style="font-size:10px;color:#999;margin-top:4px">Camera or Gallery (screenshots accepted)</p>
        <input type="file" id="file_${boxId}" accept="image/*" onchange="uploadPaymentProof('${poolId}',${month},'${pool.name}',${pool.monthlyAmt},this)">
    </div>
    <div id="uploadStatus_${boxId}" style="margin-top:8px"></div>`;
}

async function uploadPaymentProof(poolId,month,poolName,amount,fileInput){
    const file=fileInput.files[0];
    if(!file){return;}
    const boxId='upload_'+poolId+'_'+month;
    const statusEl=document.getElementById('uploadStatus_'+boxId);
    statusEl.innerHTML='<div class="msg" style="background:#E3F2FD;color:#1565C0">⏳ Uploading proof...</div>';

    try{
        // Upload to Firebase Storage
        const fileName=`payments/${CU.uid}/${poolId}_month${month}_${Date.now()}.${file.name.split('.').pop()}`;
        const ref=storage.ref(fileName);
        await ref.put(file);
        const proofUrl=await ref.getDownloadURL();

        // Get pool info for due date check
        const poolDoc=await db.collection('pools').doc(poolId).get();
        const poolData=poolDoc.data();
        const dueDay=poolData.dueDay||5;
        const now=new Date();
        const dueDate=new Date(now.getFullYear(),now.getMonth(),dueDay);

        // Save payment record
        await db.collection('payments').add({
            poolId,
            poolName,
            month,
            amount,
            memberEmail:CU.email,
            memberName:UD.name,
            memberUid:CU.uid,
            agentId:poolData.agentId,
            proofUrl,
            dueDate:dueDate.toISOString(),
            submittedAt:new Date().toISOString(),
            status:'pending',
            reviewedAt:null,
            reviewedBy:null
        });

        statusEl.innerHTML='<div class="msg msg-ok">✅ Proof uploaded successfully! Awaiting admin/agent review.</div>';
        // Show preview
        statusEl.innerHTML+=`<img src="${proofUrl}" class="proof-img" alt="Uploaded proof">`;
    }catch(err){
        statusEl.innerHTML=`<div class="msg msg-err">❌ Upload failed: ${err.message}</div>`;
    }
}

    let html=`<div class="card"><h2>My Profile</h2>
    <p><b>Name:</b> ${UD.name}</p>
    <p><b>Email:</b> ${CU.email}</p>
    <p><b>Phone:</b> ${UD.phone||'Not set'}</p>

    <div style="font-size:11px;line-height:1.8">
